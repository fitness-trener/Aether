# Aether scan — gate .aeth code on every push / PR.
#
# Runs the full Aether detector suite over the tracked corpus, uploads
# findings to GitHub Code Scanning as SARIF, and fails on any finding the
# tree does not already declare. Aether is stdlib-only (Python 3.10+), so
# there is nothing to install.
#
# ---------------------------------------------------------------------
# Why --expect, and why SCAN_PATH is not "."
# ---------------------------------------------------------------------
# This repository deliberately CONTAINS violations: every detector ships a
# `demos/case_studies/<class>/` pair — a vulnerable file and its fix — and
# the playground examples exist to be flagged. A gate that fails on any
# finding is therefore red by construction. This one was, from 2026-07-09
# until 2026-07-25: it ran `tools.scan .` over the whole repo and exited 1
# on the first demo it met, so a genuine regression looked exactly like
# every other run and the job carried no signal.
#
# The fix is `--expect`: each `.aeth` states the codes it produces in a
# `// expect:` header, and the gate fails on the DIFFERENCE — a finding
# nobody declared, or a declared finding that stopped firing. That second
# direction is new; "fail on any finding" could only ever count upward, so
# a detector going quiet passed silently.
#
# SCAN_PATH is the corpus scope from ADR-0003, mirroring `CORPUS_ROOTS` in
# `tools/expectations.py` and the scope `tests/test_corpus.py` enforces.
# `bench/` (generated tasks, graded on whether the fix-loop repairs them)
# and `reference/` (driven by `cli test`, which runs no static passes per
# ADR-0001) are out, as are the fixture trees under `tests/`, `runs/`,
# `validation/` and `outreach/`.
#
# CONSUMER REPOS: set `SCAN_PATH: .` and keep the flag. A file with no
# `// expect:` header is held to `clean`, so in a repo that uses no
# headers `--expect` behaves exactly like a plain scan — any finding
# fails the build.

name: aether-scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to Code Scanning

env:
  SCAN_PATH: "demos playground/examples"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SARIF carries only the UNDECLARED findings, so Code Scanning shows
      # real alerts instead of the demos that are flagged on purpose.
      - name: Run Aether scan (SARIF)
        run: |
          set +e
          python -m tools.scan ${SCAN_PATH} --expect --sarif > aether.sarif
          set -e

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aether.sarif

      # Re-run for the human-readable report and the exit code. Cheap
      # (stdlib-only, no build) and it keeps the failure message in the log
      # right next to the diff that caused it.
      - name: Fail on undeclared findings
        run: |
          python -m tools.scan ${SCAN_PATH} --expect || {
            echo "::error::Aether findings differ from what the corpus declares."
            echo "An UNEXPECTED finding is a real violation, or a demo whose"
            echo "'// expect:' header needs updating because behaviour"
            echo "legitimately changed. A DECLARED BUT NOT REPORTED code is a"
            echo "detector regression — do not 'fix' that by editing the header."
            exit 1
          }
